[project]
name = "telegram-stream"
version = "0.1.0"
description = "Internal Telegram byte-range streaming service for 9Drive WebDAV."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "telethon==1.44.0",
    "cryptg==0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
