# 9Drive Server Browser — sole egress for the isolated browser network.
#
# Browser containers live on an `internal: true` Docker network with no
# internet route; their HTTP(S)_PROXY points here. Squid re-resolves DNS on
# every request (redirect/DNS-rebinding safe) and denies destinations in
# loopback, private, link-local (cloud metadata 169.254.169.254), CGNAT,
# documentation, benchmark, multicast, and reserved space — the same blocklist
# the backend SSRF gate (`backend/src/modules/remote-imports/ssrf.ts`) uses.
# Only plain HTTP and CONNECT-to-443 are allowed; nothing else leaves.
#
# This proxy is a network control, not a privacy tool: it never logs full
# URLs with query strings at default verbosity for browser traffic auditing.

http_port 3128

# ── Destination blocklist (never reachable through this proxy) ──────────────
acl denylocal dst 0.0.0.0/8
acl denylocal dst 10.0.0.0/8
acl denylocal dst 100.64.0.0/10
acl denylocal dst 127.0.0.0/8
acl denylocal dst 169.254.0.0/16
acl denylocal dst 172.16.0.0/12
acl denylocal dst 192.0.0.0/24
acl denylocal dst 192.0.2.0/24
acl denylocal dst 192.168.0.0/16
acl denylocal dst 198.18.0.0/15
acl denylocal dst 198.51.100.0/24
acl denylocal dst 203.0.113.0/24
acl denylocal dst 224.0.0.0/4
acl denylocal dst 240.0.0.0/4
acl denylocal dst fc00::/7
acl denylocal dst fe80::/10
acl denylocal dst ::1/128

# ── Safe ports only ─────────────────────────────────────────────────────────
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny denylocal
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Clients are the browser containers on the isolated network.
http_access allow localhost
http_access allow all

# No disk cache: this is an egress filter, not an accelerator.
cache deny all

# Operational logging to the image's default log dir (writable by the `proxy`
# user). `stdio:/dev/stdout` is NOT usable here — the daemon drops privileges
# and cannot open it. Tail with:
#   docker compose exec browser-egress-proxy tail -f /var/log/squid/access.log
access_log daemon:/var/log/squid/access.log squid
coredump_dir none
