services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-9drive}
      MYSQL_USER: ${MYSQL_USER:-9drive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-database-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal only — not published to the host. BullMQ producer (backend) and
    # the remote-import worker both reach it over the compose network.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      # Repo root context: the Dockerfile copies backend/ for the app and
      # extensions/ for the Browser Capture zip served at /browser-capture/extension.zip.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-9drive}:${MYSQL_PASSWORD:-change-this-database-password}@mysql:3306/${MYSQL_DATABASE:-9drive}
      APP_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-jwt-secret-at-least-32-chars}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-change-this-encryption-key-32bytes!}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_BYTES: 5368709120
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/connected-accounts/google/callback}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
      SMB_ENABLED: ${SMB_ENABLED:-false}
      SMB_CONFIG_PATH: ${SMB_CONFIG_PATH:-}
      SMB_ALLOWED_ROOT: ${SMB_ALLOWED_ROOT:-}
      # Telegram Drive storage provider (MTProto)
      TELEGRAM_MAX_FILE_BYTES: ${TELEGRAM_MAX_FILE_BYTES:-2147483648}
      TELEGRAM_STORAGE_CHANNEL: ${TELEGRAM_STORAGE_CHANNEL:-9drive}
      # Telegram sync (channel ↔ 9Drive reconciliation)
      TELEGRAM_SYNC_AUTO_ENABLED: ${TELEGRAM_SYNC_AUTO_ENABLED:-true}
      TELEGRAM_SYNC_INTERVAL_MINUTES: ${TELEGRAM_SYNC_INTERVAL_MINUTES:-30}
      TELEGRAM_SYNC_PAGE_SIZE: ${TELEGRAM_SYNC_PAGE_SIZE:-100}
      TELEGRAM_SYNC_CONCURRENCY: ${TELEGRAM_SYNC_CONCURRENCY:-2}
      TELEGRAM_SYNC_FLOOD_WAIT_RETRIES: ${TELEGRAM_SYNC_FLOOD_WAIT_RETRIES:-3}
      TELEGRAM_SYNC_FULL_EVERY_MINUTES: ${TELEGRAM_SYNC_FULL_EVERY_MINUTES:-360}
      TELEGRAM_SYNC_TRASH_MISSING: ${TELEGRAM_SYNC_TRASH_MISSING:-false}
      # Telegram metadata protection. No default for the master key: an empty
      # value means "not configured" and protected uploads fail safely rather
      # than silently falling back to plaintext.
      TELEGRAM_METADATA_ENCRYPTION_ENABLED: ${TELEGRAM_METADATA_ENCRYPTION_ENABLED:-false}
      TELEGRAM_METADATA_MASTER_KEY: ${TELEGRAM_METADATA_MASTER_KEY:-}
      TELEGRAM_CRYPTO_SALT: ${TELEGRAM_CRYPTO_SALT:-9drive-telegram-v1}
      TELEGRAM_OBFUSCATE_FILENAME_ENABLED: ${TELEGRAM_OBFUSCATE_FILENAME_ENABLED:-false}
      TELEGRAM_OBFUSCATE_FILE_EXTENSION: ${TELEGRAM_OBFUSCATE_FILE_EXTENSION:-true}
      # Temp staging dir for chunked (non-Google) resumable uploads
      UPLOAD_TEMP_DIR: /data/upload-tmp
      # Remote Import — queue + temp staging
      REDIS_URL: redis://redis:6379
      REMOTE_IMPORT_ENABLED: ${REMOTE_IMPORT_ENABLED:-true}
      REMOTE_IMPORT_MAX_BYTES: ${REMOTE_IMPORT_MAX_BYTES:-5368709120}
      REMOTE_IMPORT_GLOBAL_CONCURRENCY: ${REMOTE_IMPORT_GLOBAL_CONCURRENCY:-4}
      REMOTE_IMPORT_PER_USER_CONCURRENCY: ${REMOTE_IMPORT_PER_USER_CONCURRENCY:-2}
      REMOTE_IMPORT_MAX_REDIRECTS: ${REMOTE_IMPORT_MAX_REDIRECTS:-5}
      REMOTE_IMPORT_CONNECT_TIMEOUT_SECONDS: ${REMOTE_IMPORT_CONNECT_TIMEOUT_SECONDS:-15}
      REMOTE_IMPORT_IDLE_TIMEOUT_SECONDS: ${REMOTE_IMPORT_IDLE_TIMEOUT_SECONDS:-60}
      REMOTE_IMPORT_JOB_TIMEOUT_HOURS: ${REMOTE_IMPORT_JOB_TIMEOUT_HOURS:-12}
      REMOTE_IMPORT_DOWNLOAD_ATTEMPTS: ${REMOTE_IMPORT_DOWNLOAD_ATTEMPTS:-3}
      REMOTE_IMPORT_UPLOAD_ATTEMPTS: ${REMOTE_IMPORT_UPLOAD_ATTEMPTS:-2}
      REMOTE_IMPORT_TEMP_RETENTION_HOURS: ${REMOTE_IMPORT_TEMP_RETENTION_HOURS:-24}
      REMOTE_IMPORT_PROGRESS_UPDATE_INTERVAL_MS: ${REMOTE_IMPORT_PROGRESS_UPDATE_INTERVAL_MS:-1000}
      REMOTE_IMPORT_QUEUE_START_TIMEOUT_SECONDS: ${REMOTE_IMPORT_QUEUE_START_TIMEOUT_SECONDS:-300}
      REMOTE_IMPORT_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${REMOTE_IMPORT_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-120}
      REMOTE_IMPORT_TEMP_DIR: /data/remote-import-tmp
      # HLS/M3U8 remote imports (§1–§21)
      REMOTE_IMPORT_HLS_ENABLED: ${REMOTE_IMPORT_HLS_ENABLED:-true}
      REMOTE_IMPORT_HLS_MAX_MANIFEST_BYTES: ${REMOTE_IMPORT_HLS_MAX_MANIFEST_BYTES:-1048576}
      REMOTE_IMPORT_HLS_MAX_PLAYLIST_DEPTH: ${REMOTE_IMPORT_HLS_MAX_PLAYLIST_DEPTH:-4}
      REMOTE_IMPORT_HLS_MAX_VARIANTS: ${REMOTE_IMPORT_HLS_MAX_VARIANTS:-50}
      REMOTE_IMPORT_HLS_MAX_SEGMENTS: ${REMOTE_IMPORT_HLS_MAX_SEGMENTS:-50000}
      REMOTE_IMPORT_HLS_MAX_SEGMENT_BYTES: ${REMOTE_IMPORT_HLS_MAX_SEGMENT_BYTES:-268435456}
      REMOTE_IMPORT_HLS_SEGMENT_CONCURRENCY: ${REMOTE_IMPORT_HLS_SEGMENT_CONCURRENCY:-6}
      REMOTE_IMPORT_HLS_SEGMENT_ATTEMPTS: ${REMOTE_IMPORT_HLS_SEGMENT_ATTEMPTS:-4}
      REMOTE_IMPORT_HLS_LIVE_ENABLED: ${REMOTE_IMPORT_HLS_LIVE_ENABLED:-true}
      REMOTE_IMPORT_HLS_MIN_RECORD_SECONDS: ${REMOTE_IMPORT_HLS_MIN_RECORD_SECONDS:-60}
      REMOTE_IMPORT_HLS_MAX_RECORD_SECONDS: ${REMOTE_IMPORT_HLS_MAX_RECORD_SECONDS:-21600}
      REMOTE_IMPORT_HLS_DEFAULT_CONTAINER: ${REMOTE_IMPORT_HLS_DEFAULT_CONTAINER:-mkv}
      REMOTE_IMPORT_FFMPEG_PATH: /usr/bin/ffmpeg
      REMOTE_IMPORT_FFPROBE_PATH: /usr/bin/ffprobe
      REMOTE_IMPORT_FFMPEG_TIMEOUT_SECONDS: ${REMOTE_IMPORT_FFMPEG_TIMEOUT_SECONDS:-3600}
      REMOTE_IMPORT_HLS_MAX_HEIGHT: ${REMOTE_IMPORT_HLS_MAX_HEIGHT:-2160}
      REMOTE_IMPORT_HLS_MAX_BANDWIDTH: ${REMOTE_IMPORT_HLS_MAX_BANDWIDTH:-0}
      REMOTE_IMPORT_HLS_MAX_KEY_BYTES: ${REMOTE_IMPORT_HLS_MAX_KEY_BYTES:-65536}
      REMOTE_IMPORT_REQUEST_CONTEXT_ENABLED: ${REMOTE_IMPORT_REQUEST_CONTEXT_ENABLED:-true}
      REMOTE_IMPORT_CURL_INPUT_ENABLED: ${REMOTE_IMPORT_CURL_INPUT_ENABLED:-true}
      REMOTE_IMPORT_REQUEST_CONTEXT_MAX_CURL_BYTES: ${REMOTE_IMPORT_REQUEST_CONTEXT_MAX_CURL_BYTES:-65536}
      REMOTE_IMPORT_REQUEST_CONTEXT_MAX_COOKIE_BYTES: ${REMOTE_IMPORT_REQUEST_CONTEXT_MAX_COOKIE_BYTES:-16384}
      REMOTE_IMPORT_REQUEST_CONTEXT_COOKIE_SCOPE: ${REMOTE_IMPORT_REQUEST_CONTEXT_COOKIE_SCOPE:-source-host}
      # ── Telegram Stream (internal byte-range service) ──────────────────
      TELEGRAM_STREAM_NODE_URL: ${TELEGRAM_STREAM_NODE_URL:-http://telegram-stream:8081}
      TELEGRAM_STREAM_INTERNAL_SECRET: ${TELEGRAM_STREAM_INTERNAL_SECRET:-Uxw7qgqZ7j6IqFIy5TT6knce2SY0_nTuZz_pcqbW2hk}
      TELEGRAM_STREAM_CHUNK_SIZE_BYTES: ${TELEGRAM_STREAM_CHUNK_SIZE_BYTES:-1048576}
      TELEGRAM_STREAM_PREFETCH: ${TELEGRAM_STREAM_PREFETCH:-3}
      TELEGRAM_STREAM_PARALLELISM: ${TELEGRAM_STREAM_PARALLELISM:-2}
    volumes:
      - remote_import_tmp:/data/remote-import-tmp
      - upload_tmp:/data/upload-tmp
    ports:
      - "4000:4000"

  telegram-stream:
    build:
      context: ./services/telegram-stream
      dockerfile: Dockerfile
    restart: unless-stopped
    # Internal-only: no host port. Backend talks to it via DNS
    # `telegram-stream:8081` over the default compose network.
    expose:
      - "8081"
    environment:
      TELEGRAM_STREAM_HOST: "0.0.0.0"
      TELEGRAM_STREAM_PORT: "8081"
      TELEGRAM_STREAM_INTERNAL_SECRET: ${TELEGRAM_STREAM_INTERNAL_SECRET:-Uxw7qgqZ7j6IqFIy5TT6knce2SY0_nTuZz_pcqbW2hk}
      TELEGRAM_STREAM_CHUNK_SIZE_BYTES: ${TELEGRAM_STREAM_CHUNK_SIZE_BYTES:-1048576}
      TELEGRAM_STREAM_PREFETCH: ${TELEGRAM_STREAM_PREFETCH:-3}
      TELEGRAM_STREAM_PARALLELISM: ${TELEGRAM_STREAM_PARALLELISM:-2}
      TELEGRAM_STREAM_LOG_LEVEL: ${TELEGRAM_STREAM_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8081/health',timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Resource hints: a single Telegram stream worker is enough for
    # a Jellyfin + rclone deployment; the in-process client cache means
    # memory grows with the number of *connected* accounts, not the
    # number of streams.
    mem_limit: 512m

  remote-import-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "npm run db:migrate:deploy && node dist/modules/remote-imports/worker-entry.js"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-9drive}:${MYSQL_PASSWORD:-change-this-database-password}@mysql:3306/${MYSQL_DATABASE:-9drive}
      APP_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-jwt-secret-at-least-32-chars}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-change-this-encryption-key-32bytes!}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_BYTES: 5368709120
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/connected-accounts/google/callback}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
      SMB_ENABLED: ${SMB_ENABLED:-false}
      SMB_CONFIG_PATH: ${SMB_CONFIG_PATH:-}
      SMB_ALLOWED_ROOT: ${SMB_ALLOWED_ROOT:-}
      # Telegram Drive storage provider (MTProto) — placement runs in the worker
      TELEGRAM_MAX_FILE_BYTES: ${TELEGRAM_MAX_FILE_BYTES:-2147483648}
      TELEGRAM_STORAGE_CHANNEL: ${TELEGRAM_STORAGE_CHANNEL:-9drive}
      # Telegram sync (channel ↔ 9Drive reconciliation)
      TELEGRAM_SYNC_AUTO_ENABLED: ${TELEGRAM_SYNC_AUTO_ENABLED:-true}
      TELEGRAM_SYNC_INTERVAL_MINUTES: ${TELEGRAM_SYNC_INTERVAL_MINUTES:-30}
      TELEGRAM_SYNC_PAGE_SIZE: ${TELEGRAM_SYNC_PAGE_SIZE:-100}
      TELEGRAM_SYNC_CONCURRENCY: ${TELEGRAM_SYNC_CONCURRENCY:-2}
      TELEGRAM_SYNC_FLOOD_WAIT_RETRIES: ${TELEGRAM_SYNC_FLOOD_WAIT_RETRIES:-3}
      TELEGRAM_SYNC_FULL_EVERY_MINUTES: ${TELEGRAM_SYNC_FULL_EVERY_MINUTES:-360}
      TELEGRAM_SYNC_TRASH_MISSING: ${TELEGRAM_SYNC_TRASH_MISSING:-false}
      # Telegram metadata protection — the worker uploads to Telegram too, so it
      # needs the same key. A mismatch here would write payloads the API cannot read.
      TELEGRAM_METADATA_ENCRYPTION_ENABLED: ${TELEGRAM_METADATA_ENCRYPTION_ENABLED:-false}
      TELEGRAM_METADATA_MASTER_KEY: ${TELEGRAM_METADATA_MASTER_KEY:-}
      TELEGRAM_CRYPTO_SALT: ${TELEGRAM_CRYPTO_SALT:-9drive-telegram-v1}
      TELEGRAM_OBFUSCATE_FILENAME_ENABLED: ${TELEGRAM_OBFUSCATE_FILENAME_ENABLED:-false}
      TELEGRAM_OBFUSCATE_FILE_EXTENSION: ${TELEGRAM_OBFUSCATE_FILE_EXTENSION:-true}
      # Remote Import — same queue as the API, temp staging shared with backend
      REDIS_URL: redis://redis:6379
      REMOTE_IMPORT_ENABLED: ${REMOTE_IMPORT_ENABLED:-true}
      REMOTE_IMPORT_MAX_BYTES: ${REMOTE_IMPORT_MAX_BYTES:-5368709120}
      REMOTE_IMPORT_GLOBAL_CONCURRENCY: ${REMOTE_IMPORT_GLOBAL_CONCURRENCY:-4}
      REMOTE_IMPORT_PER_USER_CONCURRENCY: ${REMOTE_IMPORT_PER_USER_CONCURRENCY:-2}
      REMOTE_IMPORT_MAX_REDIRECTS: ${REMOTE_IMPORT_MAX_REDIRECTS:-5}
      REMOTE_IMPORT_CONNECT_TIMEOUT_SECONDS: ${REMOTE_IMPORT_CONNECT_TIMEOUT_SECONDS:-15}
      REMOTE_IMPORT_IDLE_TIMEOUT_SECONDS: ${REMOTE_IMPORT_IDLE_TIMEOUT_SECONDS:-60}
      REMOTE_IMPORT_JOB_TIMEOUT_HOURS: ${REMOTE_IMPORT_JOB_TIMEOUT_HOURS:-12}
      REMOTE_IMPORT_DOWNLOAD_ATTEMPTS: ${REMOTE_IMPORT_DOWNLOAD_ATTEMPTS:-3}
      REMOTE_IMPORT_UPLOAD_ATTEMPTS: ${REMOTE_IMPORT_UPLOAD_ATTEMPTS:-2}
      REMOTE_IMPORT_TEMP_RETENTION_HOURS: ${REMOTE_IMPORT_TEMP_RETENTION_HOURS:-24}
      REMOTE_IMPORT_PROGRESS_UPDATE_INTERVAL_MS: ${REMOTE_IMPORT_PROGRESS_UPDATE_INTERVAL_MS:-1000}
      REMOTE_IMPORT_QUEUE_START_TIMEOUT_SECONDS: ${REMOTE_IMPORT_QUEUE_START_TIMEOUT_SECONDS:-300}
      REMOTE_IMPORT_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${REMOTE_IMPORT_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-120}
      REMOTE_IMPORT_TEMP_DIR: /data/remote-import-tmp
      # HLS/M3U8 remote imports — the worker is the only process that spawns
      # FFmpeg (§15); keep the same HLS knobs as the API service.
      REMOTE_IMPORT_HLS_ENABLED: ${REMOTE_IMPORT_HLS_ENABLED:-true}
      REMOTE_IMPORT_HLS_MAX_MANIFEST_BYTES: ${REMOTE_IMPORT_HLS_MAX_MANIFEST_BYTES:-1048576}
      REMOTE_IMPORT_HLS_MAX_PLAYLIST_DEPTH: ${REMOTE_IMPORT_HLS_MAX_PLAYLIST_DEPTH:-4}
      REMOTE_IMPORT_HLS_MAX_VARIANTS: ${REMOTE_IMPORT_HLS_MAX_VARIANTS:-50}
      REMOTE_IMPORT_HLS_MAX_SEGMENTS: ${REMOTE_IMPORT_HLS_MAX_SEGMENTS:-50000}
      REMOTE_IMPORT_HLS_MAX_SEGMENT_BYTES: ${REMOTE_IMPORT_HLS_MAX_SEGMENT_BYTES:-268435456}
      REMOTE_IMPORT_HLS_SEGMENT_CONCURRENCY: ${REMOTE_IMPORT_HLS_SEGMENT_CONCURRENCY:-6}
      REMOTE_IMPORT_HLS_SEGMENT_ATTEMPTS: ${REMOTE_IMPORT_HLS_SEGMENT_ATTEMPTS:-4}
      REMOTE_IMPORT_HLS_LIVE_ENABLED: ${REMOTE_IMPORT_HLS_LIVE_ENABLED:-true}
      REMOTE_IMPORT_HLS_MIN_RECORD_SECONDS: ${REMOTE_IMPORT_HLS_MIN_RECORD_SECONDS:-60}
      REMOTE_IMPORT_HLS_MAX_RECORD_SECONDS: ${REMOTE_IMPORT_HLS_MAX_RECORD_SECONDS:-21600}
      REMOTE_IMPORT_HLS_DEFAULT_CONTAINER: ${REMOTE_IMPORT_HLS_DEFAULT_CONTAINER:-mkv}
      REMOTE_IMPORT_FFMPEG_PATH: /usr/bin/ffmpeg
      REMOTE_IMPORT_FFPROBE_PATH: /usr/bin/ffprobe
      REMOTE_IMPORT_FFMPEG_TIMEOUT_SECONDS: ${REMOTE_IMPORT_FFMPEG_TIMEOUT_SECONDS:-3600}
      REMOTE_IMPORT_HLS_MAX_HEIGHT: ${REMOTE_IMPORT_HLS_MAX_HEIGHT:-2160}
      REMOTE_IMPORT_HLS_MAX_BANDWIDTH: ${REMOTE_IMPORT_HLS_MAX_BANDWIDTH:-0}
      REMOTE_IMPORT_HLS_MAX_KEY_BYTES: ${REMOTE_IMPORT_HLS_MAX_KEY_BYTES:-65536}
      REMOTE_IMPORT_REQUEST_CONTEXT_ENABLED: ${REMOTE_IMPORT_REQUEST_CONTEXT_ENABLED:-true}
      REMOTE_IMPORT_CURL_INPUT_ENABLED: ${REMOTE_IMPORT_CURL_INPUT_ENABLED:-true}
      REMOTE_IMPORT_REQUEST_CONTEXT_MAX_CURL_BYTES: ${REMOTE_IMPORT_REQUEST_CONTEXT_MAX_CURL_BYTES:-65536}
      REMOTE_IMPORT_REQUEST_CONTEXT_MAX_COOKIE_BYTES: ${REMOTE_IMPORT_REQUEST_CONTEXT_MAX_COOKIE_BYTES:-16384}
      REMOTE_IMPORT_REQUEST_CONTEXT_COOKIE_SCOPE: ${REMOTE_IMPORT_REQUEST_CONTEXT_COOKIE_SCOPE:-source-host}
    volumes:
      - remote_import_tmp:/data/remote-import-tmp

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5178:80"

volumes:
  mysql_data:
  remote_import_tmp:
  upload_tmp:
