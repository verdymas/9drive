<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; font: 13px/1.4 system-ui, sans-serif; }
    header { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 14px; margin: 0; }
    .status { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #dcfce7; color: #166534; }
    .status.off { background: #fee2e2; color: #991b1b; }
    main { max-height: 380px; overflow-y: auto; padding: 6px 8px; }
    .item { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
    .item .name { font-weight: 600; word-break: break-all; }
    .item .meta { font-size: 11px; color: #6b7280; margin: 2px 0 6px; }
    .row { display: flex; gap: 6px; }
    button { flex: 1; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    button.primary { background: #2563eb; border-color: #2563eb; color: white; }
    button.danger { color: #b91c1c; }
    button:hover { filter: brightness(0.96); }
    .empty { text-align: center; color: #6b7280; padding: 24px 10px; }
    /* Pair form */
    form { padding: 12px; }
    label { display: block; font-size: 11px; margin: 8px 0 3px; color: #374151; }
    input { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; }
    .msg { margin-top: 8px; font-size: 12px; }
    .msg.err { color: #b91c1c; }
    /* Dialog */
    dialog { border: none; border-radius: 10px; padding: 14px; width: 300px; }
    dialog::backdrop { background: rgba(0,0,0,0.35); }
    select, dialog input { width: 100%; margin-bottom: 8px; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>9Drive Capture</h1>
    <span id="conn" class="status off">Not connected</span>
  </header>

  <form id="pairForm" hidden>
    <p style="font-size:12px;color:#374151">Open 9Drive → <b>Settings → Browser Capture</b>, create a pairing code, and paste it here.</p>
    <label for="baseUrl">9Drive backend URL</label>
    <input id="baseUrl" placeholder="https://your-9drive.example.com" required />
    <label for="pairingCode">Pairing code</label>
    <input id="pairingCode" placeholder="Paste the code from Settings" required />
    <button class="primary" type="submit">Connect</button>
    <div id="pairMsg" class="msg"></div>
  </form>

  <main id="list">
    <div class="empty" id="empty">No captured media yet.<br />Play or open a video/PDF to detect it.</div>
  </main>

  <dialog id="importDialog">
    <h3 style="margin:0 0 10px;font-size:14px">Import to 9Drive</h3>
    <label>Filename</label><input id="dlgName" />
    <label>Destination folder</label><select id="dlgFolder"><option value="">Root</option></select>
    <label>Storage account</label><select id="dlgAccount"><option value="">Automatic</option></select>
    <label>Network route</label><select id="dlgWorker"><option value="">Direct</option></select>
    <div class="row" style="margin-top:8px">
      <button type="button" id="dlgCancel">Cancel</button>
      <button class="primary" type="button" id="dlgStart">Start Import</button>
    </div>
    <div id="dlgMsg" class="msg"></div>
  </dialog>

  <script src="popup.js" type="module"></script>
</body>
</html>
